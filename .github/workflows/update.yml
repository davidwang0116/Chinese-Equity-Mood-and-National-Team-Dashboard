name: 抓数 · 回测 · 仪表盘

on:
  push:
    branches: ["**"]
    paths:
      - "**.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    # 北京时间工作日 18:10（收盘后；两融数据次日早晨补齐，下一次运行会覆盖）
    - cron: "10 10 * * 1-5"
  workflow_dispatch:
    inputs:
      sources:
        description: "只抓指定数据源（空格分隔，留空=全部）：indexes asset qvix margin valuation high_low market_flow etf_daily etf_shares breadth"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 单元测试（合成数据，离线）
        run: python -m pytest -q

      - name: 抓取数据
        continue-on-error: true
        run: python fetch_all.py ${{ github.event.inputs.sources }}

      - name: 回测
        continue-on-error: true
        run: python backtest.py

      - name: 生成仪表盘
        continue-on-error: true
        run: python main.py

      - name: 提交数据快照与报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
